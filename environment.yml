name: prism-dp-lora
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24,<27
  - packaging>=24,<27
  - setuptools>=70
  - wheel>=0.43
  # Keep pip-installed PyArrow/Transformers native extensions off an older
  # host libstdc++; the preflight still verifies the resulting ABI at runtime.
  - libgcc-ng>=14
  - libstdcxx-ng>=14
  - pip:
      - -r requirements-dev.txt
variables:
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"
